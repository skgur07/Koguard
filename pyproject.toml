[project]
name = "koguard"
version = "0.1.0"
description = "A lightweight Korean profanity detection engine"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
license-files = [
    "LICENSE",
    "src/koguard/data/KORCEN-MIT.txt",
    "src/koguard/data/CURSE-DETECTION-DATA-MIT.txt",
]
authors = [{ name = "skgur07" }]
keywords = ["korean", "profanity", "filter", "moderation"]
dependencies = []

[project.urls]
Repository = "https://github.com/skgur07/Koguard"
Issues = "https://github.com/skgur07/Koguard/issues"
Documentation = "https://github.com/skgur07/Koguard#readme"
Changelog = "https://github.com/skgur07/Koguard/blob/dev/CHANGELOG.md"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/koguard"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/benchmarks",
    "/evaluation",
    "/release",
    "/docs/corpus-annotation-guide.md",
    "/docs/corpus-split-policy.md",
    "/docs/corpus-intake-status.md",
    "/docs/source-rights-audit.md",
    "/docs/dictionary-provenance.md",
    "/docs/dictionary-data-changelog.md",
    "/docs/profile-api-contract.md",
    "/docs/contains-api.md",
    "/docs/public-api-inventory.md",
    "/docs/unicode-fp-hardening.md",
    "/docs/release-hardening.md",
    "/docs/pf014-release-readiness.md",
    "/docs/testing/dictionary-provenance.tdd.md",
    "/docs/testing/contains-api.tdd.md",
    "/docs/testing/public-api-audit.tdd.md",
    "/docs/testing/unicode-fp-hardening.tdd.md",
    "/docs/testing/release-hardening.tdd.md",
    "/docs/testing/pf014-release-readiness.tdd.md",
    "/docs/testing/multi-source-corpus-intake.tdd.md",
    "/docs/testing/profile-api-contract.tdd.md",
    "/docs/testing/quarantine-intake.tdd.md",
    "/README.md",
    "/CHANGELOG.md",
    "/SECURITY.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/.mailmap",
]
exclude = [
    "/evaluation/annotation-work",
    "/evaluation/quarantine",
    "/evaluation/corpus/tuning",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "evaluation", "release"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "benchmarks", "evaluation", "release"]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=koguard",
    "--cov-report=term-missing",
]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["koguard"]

[tool.coverage.report]
fail_under = 90
show_missing = true
