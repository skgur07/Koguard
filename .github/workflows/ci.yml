name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-package:
    name: ${{ matrix.os }} / CPython 3.11.9
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up CPython
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.9"
          check-latest: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"

      - name: Sync locked development environment
        run: uv sync --frozen --all-extras --dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Test runtime, corpus, benchmark, and branch coverage gates
        run: uv run pytest

      - name: Validate packaged dictionary provenance
        run: uv run python -m evaluation.dictionary_provenance

      - name: Build wheel and source distribution
        run: uv build

      - name: Audit public artifact contents
        run: uv run python -m release.artifact_audit --dist-dir dist --output release-audit-${{ runner.os }}.json

      - name: Run clean-install quickstart smoke
        run: uv run python -m release.clean_install_smoke --dist-dir dist

      - name: Upload OS candidate for reproducibility verification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: koguard-0.1.0-candidate-${{ runner.os }}-python311
          path: |
            dist/*
            release-audit-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 3

  verify-release-artifact:
    name: Verify reproducible release artifact
    needs: quality-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up CPython
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.9"
          check-latest: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"

      - name: Sync locked verification environment
        run: uv sync --frozen --all-extras --dev

      - name: Download all OS candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: koguard-0.1.0-candidate-*
          path: candidates

      - name: Compare candidate bytes and select Linux authority
        run: >-
          uv run python -m release.verify_reproducible_artifacts
          --candidate-root candidates
          --output release-reproducibility.json

      - name: Upload authoritative release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: koguard-0.1.0-release-candidate
          path: |
            candidates/koguard-0.1.0-candidate-Linux-python311/dist/*
            candidates/koguard-0.1.0-candidate-Linux-python311/release-audit-Linux.json
            release-reproducibility.json
          if-no-files-found: error
          retention-days: 14
