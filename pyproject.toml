[project]
name = "koguard"
version = "0.1.0"
description = "A lightweight Korean profanity detection engine"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/koguard"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/benchmarks",
    "/evaluation",
    "/docs/corpus-annotation-guide.md",
    "/docs/corpus-split-policy.md",
    "/docs/corpus-intake-status.md",
    "/docs/source-rights-audit.md",
    "/docs/dictionary-provenance.md",
    "/docs/dictionary-data-changelog.md",
    "/docs/profile-api-contract.md",
    "/docs/testing/dictionary-provenance.tdd.md",
    "/docs/testing/profile-api-contract.tdd.md",
    "/docs/testing/quarantine-intake.tdd.md",
    "/README.md",
]
exclude = [
    "/evaluation/annotation-work",
    "/evaluation/quarantine",
    "/evaluation/corpus/tuning/curse-review-intake-v1.json",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "evaluation"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "benchmarks", "evaluation"]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=koguard",
    "--cov-report=term-missing",
]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["koguard"]

[tool.coverage.report]
fail_under = 90
show_missing = true
