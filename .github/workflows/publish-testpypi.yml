name: Publish fixed candidate to TestPyPI

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: "Type the pinned release commit to authorize this TestPyPI upload"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish audited 0.1.0 candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/project/koguard/0.1.0/
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Require the hidden-evaluated release commit
        env:
          REQUESTED_COMMIT: ${{ inputs.release_commit }}
          RELEASE_COMMIT: 813fc36c6988a7bdab68027964a206e970ab9f52
        run: |
          if [[ "$REQUESTED_COMMIT" != "$RELEASE_COMMIT" ]]; then
            echo "release_commit must equal the hidden-evaluated candidate" >&2
            exit 1
          fi

      - name: Download the authoritative candidate from the pinned CI run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: koguard-0.1.0-release-candidate
          path: candidate
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 33581853944

      - name: Verify the exact audited artifact set
        env:
          DIST_DIR: candidate/candidates/koguard-0.1.0-candidate-Linux-python311/dist
          WHEEL_SHA256: 0dd69e7aca1319694fb879ed86be7e4d79ac95d9ff539216416683c6d9a4546e
          SDIST_SHA256: 02f1fc4e432b5b85e6fc6849d8478a31128fa3c43b2eecae6ed81b94ce1ec9c7
        run: |
          test "$(find "$DIST_DIR" -maxdepth 1 -type f | wc -l)" -eq 2
          echo "$WHEEL_SHA256  $DIST_DIR/koguard-0.1.0-py3-none-any.whl" | sha256sum --check --strict
          echo "$SDIST_SHA256  $DIST_DIR/koguard-0.1.0.tar.gz" | sha256sum --check --strict

      - name: Publish the fixed artifacts to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: candidate/candidates/koguard-0.1.0-candidate-Linux-python311/dist/
          repository-url: https://test.pypi.org/legacy/
          print-hash: true
